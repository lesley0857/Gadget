{% extends "base.html" %}
{% block content %}
<main class="maintenance"><p class="eyebrow">Solar aftercare</p><h1>Request maintenance</h1><p>Tell our service team what your <strong>{{ design.project_name }}</strong> system needs.</p><form method="post">{% csrf_token %}<label>Request subject<input name="subject" value="Scheduled maintenance — {{ design.project_name }}" required></label><label>Priority<select name="priority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select></label><label>Issue or service required<textarea name="description" rows="6" placeholder="Describe performance concerns, warning lights, cleaning, inspection or repair required." required></textarea></label><button>Send maintenance request</button></form></main><style>.maintenance{max-width:680px;margin:55px auto;padding:34px;background:#fff;border:1px solid #e1e8e1;border-radius:20px}.maintenance .eyebrow{color:#135823;text-transform:uppercase;letter-spacing:.12em;font-weight:800;font-size:.75rem}.maintenance form{display:grid;gap:18px;margin-top:25px}.maintenance label{display:grid;gap:7px;font-weight:700}.maintenance input,.maintenance select,.maintenance textarea{font:inherit;padding:12px;border:1px solid #d6ded6;border-radius:10px}.maintenance button{background:#135823;color:#fff;border:0;border-radius:10px;padding:14px;font-weight:800;cursor:pointer}</style>
{% endblock %}
