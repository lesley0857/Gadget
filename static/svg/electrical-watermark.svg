<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520">
  <!--
    Remarobe Nigeria Limited — Electrical & Solar Watermark Pattern
    Icons: Hybrid Inverter · Solar Panel · LiFePO4 Solar Battery · Circuit Breaker ·
           Distribution Enclosure · Grounding Rod · Earthing Mesh · Electrical Light Bulb
    Tiling: 520×520 px repeating tile
  -->

  <!-- ═══════════════════════════════════════════════════
       1. SOLAR PANEL — top-left  (origin 20,20)
       ═══════════════════════════════════════════════════ -->
  <g transform="translate(20,20)" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- panel frame -->
    <rect x="0" y="8" width="100" height="62" rx="3"/>
    <!-- cell grid columns -->
    <line x1="25"  y1="8"  x2="25"  y2="70"/>
    <line x1="50"  y1="8"  x2="50"  y2="70"/>
    <line x1="75"  y1="8"  x2="75"  y2="70"/>
    <!-- cell grid rows -->
    <line x1="0"   y1="28" x2="100" y2="28"/>
    <line x1="0"   y1="49" x2="100" y2="49"/>
    <!-- mounting tilt legs -->
    <line x1="15"  y1="70" x2="8"   y2="80"/>
    <line x1="85"  y1="70" x2="92"  y2="80"/>
    <line x1="8"   y1="80" x2="92"  y2="80"/>
    <!-- sun rays above panel -->
    <circle cx="50" cy="-8" r="5"/>
    <line x1="50" y1="-18" x2="50" y2="-15"/>
    <line x1="50" y1="-1"  x2="50" y2="2"/>
    <line x1="37" y1="-15" x2="39" y2="-12"/>
    <line x1="63" y1="-15" x2="61" y2="-12"/>
    <line x1="33" y1="-8"  x2="36" y2="-8"/>
    <line x1="67" y1="-8"  x2="64" y2="-8"/>
    <!-- DC output cable -->
    <line x1="40" y1="80" x2="40" y2="88"/>
    <line x1="60" y1="80" x2="60" y2="88"/>
    <line x1="38" y1="88" x2="42" y2="88"/>
    <line x1="58" y1="88" x2="62" y2="88"/>
  </g>

  <!-- ═══════════════════════════════════════════════════
       2. HYBRID/SOLAR INVERTER — top-right  (origin 310,15)
       ═══════════════════════════════════════════════════ -->
  <g transform="translate(310,15)" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- enclosure box -->
    <rect x="0" y="0" width="90" height="110" rx="5"/>
    <!-- display panel -->
    <rect x="10" y="8" width="70" height="30" rx="3"/>
    <!-- sine wave on display -->
    <path d="M14,23 Q19,14 24,23 Q29,32 34,23 Q39,14 44,23 Q49,32 54,23 Q59,14 64,23 Q69,32 74,23"/>
    <!-- label row -->
    <rect x="10" y="45" width="20" height="10" rx="2"/>
    <rect x="35" y="45" width="20" height="10" rx="2"/>
    <rect x="60" y="45" width="20" height="10" rx="2"/>
    <!-- LED indicators -->
    <circle cx="16" cy="65" r="4"/>
    <circle cx="30" cy="65" r="4"/>
    <circle cx="44" cy="65" r="4"/>
    <!-- DC+AC terminals bottom -->
    <line x1="15" y1="110" x2="15" y2="120"/>
    <line x1="30" y1="110" x2="30" y2="120"/>
    <line x1="60" y1="110" x2="60" y2="120"/>
    <line x1="75" y1="110" x2="75" y2="120"/>
    <!-- small solar arrow on top -->
    <line x1="45" y1="0" x2="45" y2="-10"/>
    <polyline points="40,-5 45,-10 50,-5"/>
    <!-- ground lug -->
    <circle cx="45" cy="90" r="5"/>
    <line x1="45" y1="95" x2="45" y2="103"/>
    <line x1="40" y1="103" x2="50" y2="103"/>
    <line x1="42" y1="106" x2="48" y2="106"/>
    <line x1="44" y1="109" x2="46" y2="109"/>
  </g>

  <!-- ═══════════════════════════════════════════════════
       3. LiFePO4 SOLAR BATTERY BANK — centre  (origin 185,150)
       ═══════════════════════════════════════════════════ -->
  <g transform="translate(185,150)" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- three stacked cells -->
    <rect x="0"  y="70" width="80" height="30" rx="3"/>
    <rect x="0"  y="36" width="80" height="30" rx="3"/>
    <rect x="0"  y="2"  width="80" height="30" rx="3"/>
    <!-- positive terminal top -->
    <rect x="30" y="-8" width="10" height="10" rx="1"/>
    <!-- cell dividers / charge bars inside cells -->
    <line x1="8"  y1="12"  x2="72" y2="12"/>
    <line x1="8"  y1="17"  x2="55" y2="17"/>
    <line x1="8"  y1="46"  x2="72" y2="46"/>
    <line x1="8"  y1="51"  x2="35" y2="51"/>
    <line x1="8"  y1="80"  x2="72" y2="80"/>
    <line x1="8"  y1="85"  x2="20" y2="85"/>
    <!-- "LiFePO4" lightning bolt -->
    <polyline points="44,8 38,20 44,20 36,32"/>
    <!-- negative terminal bottom -->
    <rect x="30" y="100" width="10" height="8" rx="1"/>
    <!-- BMS PCB hint -->
    <rect x="10" y="106" width="60" height="14" rx="2"/>
    <line x1="20" y1="110" x2="70" y2="110"/>
    <circle cx="25" cy="113" r="2"/>
    <circle cx="55" cy="113" r="2"/>
  </g>

  <!-- ═══════════════════════════════════════════════════
       4. CIRCUIT BREAKER (MCB) — middle-left  (origin 20,200)
       ═══════════════════════════════════════════════════ -->
  <g transform="translate(20,200)" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="45" height="100" rx="4"/>
    <rect x="12" y="-10" width="20" height="12" rx="1"/>
    <line x1="22" y1="-18" x2="22" y2="-10"/>
    <rect x="12" y="100" width="20" height="12" rx="1"/>
    <line x1="22" y1="112" x2="22" y2="118"/>
    <rect x="14" y="30" width="17" height="32" rx="8"/>
    <line x1="8" y1="22" x2="16" y2="22"/>
    <line x1="8" y1="72" x2="16" y2="72"/>
    <rect x="27" y="50" width="12" height="8" rx="2"/>
    <line x1="5" y1="10" x2="40" y2="10"/>
    <circle cx="37" cy="22" r="2.5"/>
  </g>

  <!-- ═══════════════════════════════════════════════════
       5. ELECTRICAL LIGHT BULB / FIXTURE — middle-right (origin 430,160)
       ═══════════════════════════════════════════════════ -->
  <g transform="translate(430,160)" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bulb Glass Outline -->
    <path d="M20,0 C8,0 0,10 0,22 C0,31 6,38 10,44 C13,48 13,54 13,58 L27,58 C27,54 27,48 30,44 C34,38 40,31 40,22 C40,10 32,0 20,0 Z"/>
    <!-- Filament -->
    <path d="M15,35 L17,20 L23,20 L25,35"/>
    <circle cx="20" cy="18" r="3"/>
    <!-- Screw Base -->
    <line x1="13" y1="62" x2="27" y2="62"/>
    <line x1="14" y1="66" x2="26" y2="66"/>
    <path d="M16,66 C16,70 24,70 24,66"/>
    <!-- Glow / Light Rays -->
    <line x1="20" y1="-8" x2="20" y2="-15"/>
    <line x1="-6" y1="6" x2="-12" y2="2"/>
    <line x1="46" y1="6" x2="52" y2="2"/>
    <line x1="-8" y1="22" x2="-15" y2="22"/>
    <line x1="48" y1="22" x2="55" y2="22"/>
    <line x1="-5" y1="36" x2="-11" y2="40"/>
    <line x1="45" y1="36" x2="51" y2="40"/>
  </g>

  <!-- ═══════════════════════════════════════════════════
       6. DISTRIBUTION ENCLOSURE (DB Board) — (origin 340,300)
       ═══════════════════════════════════════════════════ -->
  <g transform="translate(340,300)" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="80" height="100" rx="4"/>
    <line x1="40" y1="5" x2="40" y2="95"/>
    <rect x="35" y="45" width="10" height="15" rx="3"/>
    <rect x="6"  y="12" width="24" height="14" rx="2"/>
    <rect x="6"  y="30" width="24" height="14" rx="2"/>
    <rect x="6"  y="48" width="24" height="14" rx="2"/>
    <rect x="50" y="12" width="24" height="14" rx="2"/>
    <rect x="50" y="30" width="24" height="14" rx="2"/>
    <rect x="50" y="48" width="24" height="14" rx="2"/>
    <line x1="5"  y1="82" x2="35"  y2="82"/>
    <line x1="45"  y1="82" x2="75"  y2="82"/>
  </g>

  <!-- ═══════════════════════════════════════════════════
       7. EARTHING ROD + GROUNDING MESH — bottom-centre (origin 60,370)
       ═══════════════════════════════════════════════════ -->
  <g transform="translate(60,370)" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="30" x2="240" y2="30"/>
    <line x1="8"  y1="30" x2="0"   y2="40"/>
    <line x1="28" y1="30" x2="20"  y2="40"/>
    <line x1="48" y1="30" x2="40"  y2="40"/>
    <line x1="68" y1="30" x2="60"  y2="40"/>
    <line x1="88" y1="30" x2="80"  y2="40"/>
    <line x1="108" y1="30" x2="100" y2="40"/>
    <line x1="128" y1="30" x2="120" y2="40"/>
    <line x1="148" y1="30" x2="140" y2="40"/>
    <line x1="168" y1="30" x2="160" y2="40"/>
    <line x1="188" y1="30" x2="180" y2="40"/>
    <line x1="208" y1="30" x2="200" y2="40"/>
    <line x1="228" y1="30" x2="220" y2="40"/>

    <line x1="20" y1="50" x2="220" y2="50"/>
    <line x1="20" y1="70" x2="220" y2="70"/>
    <line x1="20" y1="90" x2="220" y2="90"/>

    <line x1="20"  y1="40" x2="20"  y2="100"/>
    <line x1="70"  y1="40" x2="70"  y2="100"/>
    <line x1="120" y1="40" x2="120" y2="100"/>
    <line x1="170" y1="40" x2="170" y2="100"/>
    <line x1="220" y1="40" x2="220" y2="100"/>

    <circle cx="20"  cy="50" r="2.5"/>
    <circle cx="70"  cy="50" r="2.5"/>
    <circle cx="120" cy="50" r="2.5"/>
    <circle cx="170" cy="50" r="2.5"/>
    <circle cx="220" cy="50" r="2.5"/>
    <circle cx="20"  cy="70" r="2.5"/>
    <circle cx="70"  cy="70" r="2.5"/>
    <circle cx="120" cy="70" r="2.5"/>
    <circle cx="170" cy="70" r="2.5"/>
    <circle cx="220" cy="70" r="2.5"/>

    <line x1="20"  y1="40" x2="20"  y2="115"/>
    <polyline points="14,110 20,118 26,110"/>
    <line x1="120" y1="40" x2="120" y2="115"/>
    <polyline points="114,110 120,118 126,110"/>
    <line x1="220" y1="40" x2="220" y2="115"/>
    <polyline points="214,110 220,118 226,110"/>

    <line x1="120" y1="0" x2="120" y2="30"/>
    <line x1="104" y1="5"  x2="136" y2="5"/>
    <line x1="110" y1="11" x2="130" y2="11"/>
    <line x1="116" y1="17" x2="124" y2="17"/>
  </g>
</svg>
