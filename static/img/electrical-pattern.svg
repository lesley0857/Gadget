<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <g fill="none" stroke="#135823" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.075">
    
    <!-- 1. SOLAR BATTERY -->
    <g transform="translate(30, 28)">
      <rect x="0" y="14" width="90" height="58" rx="5"/>
      <!-- Terminals -->
      <rect x="14" y="6" width="16" height="8" rx="2" fill="#135823" fill-opacity="0.2"/>
      <rect x="60" y="6" width="16" height="8" rx="2" fill="#135823" fill-opacity="0.2"/>
      <!-- Polarity symbols -->
      <line x1="22" y1="23" x2="22" y2="31"/>
      <line x1="18" y1="27" x2="26" y2="27"/>
      <line x1="64" y1="27" x2="72" y2="27"/>
      <!-- Cell dividers -->
      <line x1="30" y1="20" x2="30" y2="64" stroke-dasharray="4,4"/>
      <line x1="60" y1="20" x2="60" y2="64" stroke-dasharray="4,4"/>
      <!-- Energy lightning bolt -->
      <path d="M47 24 L39 40 L48 40 L41 54 L52 37 L44 37 Z" fill="#135823" fill-opacity="0.25"/>
      <text x="45" y="66" font-family="Montserrat,Arial,sans-serif" font-size="8" font-weight="700" fill="#135823" text-anchor="middle" stroke="none" letter-spacing="1">SOLAR BATTERY</text>
    </g>

    <!-- 2. SOLAR INVERTER -->
    <g transform="translate(185, 26)">
      <rect x="0" y="6" width="96" height="66" rx="6"/>
      <!-- Display screen -->
      <rect x="10" y="14" width="34" height="18" rx="3" fill="#135823" fill-opacity="0.1"/>
      <line x1="14" y1="23" x2="38" y2="23"/>
      <!-- LED indicators -->
      <circle cx="56" cy="18" r="2.5" fill="#135823" fill-opacity="0.3"/>
      <circle cx="66" cy="18" r="2.5" fill="#135823" fill-opacity="0.3"/>
      <circle cx="76" cy="18" r="2.5" fill="#135823" fill-opacity="0.3"/>
      <!-- DC to AC Sine wave conversion -->
      <path d="M12 48 Q20 36 28 48 T44 48" stroke-width="1.8"/>
      <text x="36" y="44" font-family="sans-serif" font-size="8" font-weight="bold" fill="#135823" stroke="none">~</text>
      <!-- Cooling heat-sink fins -->
      <line x1="58" y1="42" x2="86" y2="42"/>
      <line x1="58" y1="48" x2="86" y2="48"/>
      <line x1="58" y1="54" x2="86" y2="54"/>
      <text x="48" y="66" font-family="Montserrat,Arial,sans-serif" font-size="8" font-weight="700" fill="#135823" text-anchor="middle" stroke="none" letter-spacing="1">INVERTER</text>
    </g>

    <!-- 3. ELECTRICAL SWITCH / ISOLATOR -->
    <g transform="translate(38, 175)">
      <rect x="0" y="8" width="74" height="80" rx="7"/>
      <rect x="15" y="22" width="44" height="50" rx="4"/>
      <!-- Rotary / Toggle mechanism -->
      <circle cx="37" cy="40" r="6" fill="#135823" fill-opacity="0.15"/>
      <line x1="37" y1="40" x2="37" y2="58" stroke-width="3"/>
      <circle cx="37" cy="58" r="3" fill="#135823" fill-opacity="0.4"/>
      <!-- External lugs -->
      <line x1="37" y1="-2" x2="37" y2="8"/>
      <line x1="37" y1="88" x2="37" y2="98"/>
      <circle cx="37" cy="-2" r="2.5"/>
      <circle cx="37" cy="98" r="2.5"/>
      <text x="37" y="80" font-family="Montserrat,Arial,sans-serif" font-size="8" font-weight="700" fill="#135823" text-anchor="middle" stroke="none" letter-spacing="1">SWITCH</text>
    </g>

    <!-- 4. CONTROL RELAY / CONTACTOR -->
    <g transform="translate(188, 175)">
      <rect x="0" y="8" width="88" height="80" rx="6"/>
      <!-- Relay coil symbol -->
      <path d="M12 28 C12 18, 22 18, 22 28 C22 18, 32 18, 32 28 C32 18, 42 18, 42 28 C42 18, 52 18, 52 28"/>
      <line x1="4" y1="28" x2="12" y2="28"/>
      <line x1="52" y1="28" x2="62" y2="28"/>
      <!-- Switch contact points -->
      <circle cx="20" cy="56" r="3" fill="#135823" fill-opacity="0.3"/>
      <circle cx="56" cy="50" r="3"/>
      <circle cx="56" cy="62" r="3"/>
      <line x1="23" y1="55" x2="52" y2="47" stroke-width="2.2"/>
      <!-- Terminal pins -->
      <line x1="22" y1="-2" x2="22" y2="8"/>
      <line x1="66" y1="-2" x2="66" y2="8"/>
      <line x1="22" y1="88" x2="22" y2="98"/>
      <line x1="66" y1="88" x2="66" y2="98"/>
      <text x="44" y="80" font-family="Montserrat,Arial,sans-serif" font-size="8" font-weight="700" fill="#135823" text-anchor="middle" stroke="none" letter-spacing="1">RELAY</text>
    </g>

  </g>
</svg>

